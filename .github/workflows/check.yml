# Typechecks, lints and tests mx on Linux, Windows and macOS. The Windows and macOS tests also run the binary that the
# Linux build cross-compiles for them, as a release ships it.
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # setup-bun installs the Bun that packageManager in package.json pins.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mx-windows-x64
          path: dist/mx-windows-x64.exe
          if-no-files-found: error
      # macos-latest runs on Apple silicon.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mx-darwin-arm64
          path: dist/mx-darwin-arm64
          if-no-files-found: error

  check:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - if: runner.os == 'Windows'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mx-windows-x64
          path: dist
      - if: runner.os == 'macOS'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mx-darwin-arm64
          path: dist
      # An artifact keeps no file modes. Bun.secrets writes to the default keychain, and a runner's login keychain can
      # be locked, which makes Keychain Services wait for a password no one types; the tests get an unlocked one.
      - if: runner.os == 'macOS'
        name: Make the macOS binary executable and an unlocked keychain the default
        run: |
          chmod +x dist/mx-darwin-arm64
          keychain="$RUNNER_TEMP/mx-test.keychain-db"
          security create-keychain -p mx-test "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p mx-test "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
      - run: bun run typecheck
      - run: bun run check
      - run: bun run test
